<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Misión Espacial: Las Guardianas del Universo</title>
<style>
:root{
  --panel:#fbf8ff;--panel2:#efe8ff;--ink:#2b1a55;--ink2:#5d4f86;--edge:#cdbcff;
  --pink:#ff5fa8;--pinkD:#d23f86;--cyan:#2fd0ea;--cyanD:#1499b3;--gold:#ffc94a;--goldD:#cf951a;
  --ok:#1fa872;--okbg:#e2f8ee;--oops:#ff6f62;--oopsbg:#fff0ec;--glow:rgba(120,90,255,.35);
  --fd:"Arial Rounded MT Bold","Hiragino Maru Gothic ProN","Varela Round","Trebuchet MS",system-ui,sans-serif;
  --fb:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--panel:#1e1748;--panel2:#2b2264;--ink:#f6f1ff;--ink2:#c4b7ee;--edge:#5b4aae;--okbg:#17463f;--oopsbg:#4c2441;color-scheme:dark}}
:root[data-theme="dark"]{--panel:#1e1748;--panel2:#2b2264;--ink:#f6f1ff;--ink2:#c4b7ee;--edge:#5b4aae;--okbg:#17463f;--oopsbg:#4c2441;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:var(--fb);color:var(--ink);line-height:1.45;overflow-x:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;background:#120b33;
 background-image:radial-gradient(ellipse 60% 50% at 15% 20%,rgba(255,95,168,.32),transparent 70%),radial-gradient(ellipse 55% 45% at 85% 30%,rgba(47,208,234,.28),transparent 70%),radial-gradient(ellipse 70% 60% at 50% 100%,rgba(140,90,255,.38),transparent 70%),linear-gradient(180deg,#120b33,#1d1250 60%,#120b33);background-attachment:fixed}
.d{font-family:var(--fd);font-weight:700;letter-spacing:.01em}
p{margin:.3em 0}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
button:disabled{cursor:default}
:focus-visible{outline:4px solid var(--cyan);outline-offset:3px;border-radius:14px}
#sky{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.st{position:absolute;border-radius:50%;background:#fff;animation:tw 3s ease-in-out infinite}
.st.sp{border-radius:0;clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%)}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
#scene{position:fixed;inset:0;z-index:0;opacity:0;transition:opacity .7s}
#scene.on{opacity:1}
#scene::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,11,51,.15),rgba(18,11,51,.45))}
.scene{position:absolute;inset:0;width:100%;height:100%;display:block}
#app{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:12px 14px 48px}
.ttl{color:#fff;font-family:var(--fd);text-shadow:0 0 18px rgba(255,95,168,.8),0 3px 0 #6a3fd0,0 6px 14px rgba(0,0,0,.4)}
.panel{background:var(--panel);color:var(--ink);border-radius:24px;padding:18px;border:2px solid var(--edge);box-shadow:0 0 0 4px rgba(255,255,255,.06),0 0 30px var(--glow),0 14px 30px rgba(0,0,0,.3)}
.btn{font-family:var(--fd);font-weight:700;font-size:1.08rem;min-height:56px;padding:12px 26px;border-radius:18px;background:linear-gradient(180deg,#ff7cbb,var(--pink));color:#fff;box-shadow:0 5px 0 var(--pinkD),0 0 18px rgba(255,95,168,.45);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--pinkD)}
.btn.cy{background:linear-gradient(180deg,#5fe3f5,var(--cyan));color:#08324a;box-shadow:0 5px 0 var(--cyanD),0 0 18px rgba(47,208,234,.45)}
.btn.gold{background:linear-gradient(180deg,#ffe08a,var(--gold));color:#4a2c00;box-shadow:0 5px 0 var(--goldD),0 0 18px rgba(255,201,74,.45)}
.btn.ghost{background:var(--panel2);color:var(--ink);box-shadow:0 5px 0 var(--edge)}
.btn:disabled{filter:grayscale(.8);opacity:.6;transform:none}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:14px}
.row.c{justify-content:center}.row.e{justify-content:flex-end}
.ibtn{width:50px;height:50px;border-radius:16px;background:var(--panel);border:2px solid var(--edge);display:grid;place-items:center;font-size:1.2rem;flex:none}
.ibtn.on{border-color:var(--pink);box-shadow:0 0 12px rgba(255,95,168,.5)}
.hero{display:block;width:100%;height:auto}
.bar{height:12px;border-radius:999px;background:var(--panel2);border:1px solid var(--edge);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--c,var(--pink)),var(--c2,var(--gold)));transition:width .6s}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font-weight:800;font-size:.86rem;background:var(--panel2);border:2px solid var(--edge)}
.chip.ok{border-color:var(--ok)}.chip.rev{border-color:var(--oops)}.chip.nd{opacity:.65}
.muted{color:var(--ink2);font-weight:600}

/* HUD */
.hud{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.hc{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:2px solid var(--edge);border-radius:16px;padding:6px 12px;min-height:50px;font-weight:900}
.hc small{font-weight:700;color:var(--ink2)}
.hbtn{box-shadow:0 4px 0 var(--edge)}
.hbtn:active{transform:translateY(3px);box-shadow:none}
.grow{flex:1}
.hi{width:24px;height:24px}
.gm{width:22px;height:22px;display:block}
@media (max-width:640px){.hc small{display:none}}

/* Title */
.title{min-height:calc(100vh - 70px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative;overflow:hidden}
.shipfly{position:absolute;top:8%;left:-40%;width:min(320px,50vw);animation:fly 9s linear infinite}
@keyframes fly{0%{left:-40%;transform:translateY(0) rotate(-4deg)}50%{transform:translateY(30px) rotate(2deg)}100%{left:110%;transform:translateY(-10px) rotate(-4deg)}}
.logo{margin:0;font-size:clamp(1.4rem,4vw,2.2rem);letter-spacing:.2em}
.logo2{margin:6px 0 0;font-size:clamp(2.3rem,8vw,5.2rem);line-height:1.02}
.logo2 span{display:inline-block;animation:drop .7s cubic-bezier(.2,1.5,.4,1) both}
@keyframes drop{0%{transform:translateY(-80px) scale(.5);opacity:0}100%{transform:none;opacity:1}}
.tgirls{display:flex;justify-content:center;gap:clamp(4px,2vw,22px);margin-top:16px;width:min(760px,96vw)}
.tgirls>div{flex:1;max-width:170px;animation:floaty 4s ease-in-out infinite;animation-delay:var(--d)}
@keyframes floaty{50%{transform:translateY(-10px)}}
.tag{display:inline-block;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:6px 16px;font-weight:700;margin-top:10px}

/* Dialog */
.dlg{min-height:calc(100vh - 80px);display:flex;flex-direction:column;justify-content:flex-end}
.dstage{display:grid;grid-template-columns:minmax(150px,260px) 1fr;gap:16px;align-items:end}
.dart{width:100%;max-width:260px;animation:pop .45s cubic-bezier(.2,1.5,.4,1)}
.dart .quad{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.who{margin:0;font-size:1.15rem;color:var(--c)}
.say{font-size:clamp(1.12rem,2.3vw,1.4rem);font-weight:800;margin:6px 0 2px}
.bub{border-color:var(--c);box-shadow:0 0 0 4px rgba(255,255,255,.06),0 0 30px color-mix(in srgb,var(--c) 55%,transparent)}
.ddots{display:flex;gap:6px;justify-content:center;margin-top:12px}
.ddots span{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.3)}
.ddots span.on{background:var(--pink)}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:none;opacity:1}}
@media (max-width:700px){.dstage{grid-template-columns:1fr}.dart{max-width:180px;margin:0 auto}}

/* Selection */
.sel{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:900px){.sel{grid-template-columns:1fr 1fr}}
.scard{display:flex;flex-direction:column;align-items:center;text-align:center;border-color:var(--c);padding:12px;position:relative}
.scard .fig{width:min(170px,100%);height:250px;display:flex;align-items:flex-end;justify-content:center}
.scard .fig svg{height:100%;width:auto}
.scard h3{margin:4px 0 0;color:var(--c);font-size:1.4rem}
.scard .pers{font-weight:700;font-size:.92rem;min-height:3.8em}
.scard.ready{box-shadow:0 0 0 4px var(--c),0 0 34px var(--c)}
.rbtn{width:100%;margin-top:8px}
.rbtn.on{background:var(--ok);box-shadow:0 5px 0 #127452}

/* Ship */
.ship{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;align-items:center}
@media (max-width:820px){.ship{grid-template-columns:1fr}}
.shipart{animation:hover 4s ease-in-out infinite}
@keyframes hover{50%{transform:translateY(-10px)}}
.flame{animation:flick .25s ease-in-out infinite alternate;transform-origin:right center}
@keyframes flick{to{transform:scaleX(1.2);opacity:.8}}
.rooms{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.room{display:flex;align-items:center;gap:12px;text-align:left;padding:14px;min-height:84px;border-radius:20px;background:var(--panel);border:2px solid var(--edge);box-shadow:0 5px 0 var(--edge),0 0 20px var(--glow)}
.room:active{transform:translateY(3px);box-shadow:0 2px 0 var(--edge)}
.room .ri{font-size:2rem;flex:none;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--panel2)}
.room b{display:block;font-family:var(--fd);font-size:1.08rem}
.room small{color:var(--ink2);font-weight:700}
.room.big{grid-column:1/-1;background:linear-gradient(135deg,#ff7cbb,#8f6bff);color:#fff;border-color:#fff}
.room.big small{color:#fff}
.room.big .ri{background:rgba(255,255,255,.2)}
.aria{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.aria .av{width:64px;flex:none}

/* Map */
.galaxy{position:relative;width:100%;aspect-ratio:16/10;border-radius:28px;overflow:hidden;border:2px solid rgba(255,255,255,.3);background:radial-gradient(ellipse at 30% 40%,rgba(255,95,168,.35),transparent 55%),radial-gradient(ellipse at 75% 65%,rgba(47,208,234,.3),transparent 55%),#140d3c;box-shadow:0 0 40px var(--glow)}
.galaxy .route{position:absolute;inset:0;width:100%;height:100%}
.route .pt{display:none}
.planet{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%);width:clamp(84px,14%,150px);display:flex;flex-direction:column;align-items:center;gap:4px;color:#fff;text-align:center}
.planet .pa{width:100%;filter:drop-shadow(0 0 16px var(--c));transition:transform .2s}
.planet:not(:disabled) .pa{animation:spinp 18s linear infinite}
@keyframes spinp{50%{transform:scale(1.06)}}
.planet b{font-family:var(--fd);font-size:clamp(.78rem,1.6vw,1rem);background:rgba(18,11,51,.75);border:1px solid var(--c);border-radius:12px;padding:3px 8px}
.planet small{font-weight:800;font-size:.75rem;background:var(--c);color:#1a0f3e;border-radius:999px;padding:1px 8px}
.planet:disabled{filter:grayscale(1) brightness(.55)}
.planet.cur .pa{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.1);filter:drop-shadow(0 0 30px var(--c))}}
.mapship{position:absolute;width:clamp(60px,9%,100px);left:var(--x);top:var(--y);transform:translate(-50%,-250%);transition:left 1s,top 1s;pointer-events:none}
@media (max-width:760px) and (orientation:portrait){
  .galaxy{aspect-ratio:3/4.4}
  .planet{left:var(--px);top:var(--py);width:clamp(84px,24%,130px)}
  .mapship{left:var(--px);top:var(--py)}
  .route .ln{display:none}.route .pt{display:inline}
}

/* World */
.whead{display:grid;grid-template-columns:140px 1fr;gap:16px;align-items:center}
.whead .pa{width:140px;filter:drop-shadow(0 0 18px var(--c))}
@media (max-width:600px){.whead{grid-template-columns:90px 1fr}.whead .pa{width:90px}}
.mlist{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
@media (max-width:760px){.mlist{grid-template-columns:1fr}}
.mcard{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:center;text-align:left;padding:14px;border-radius:20px;background:var(--panel);border:2px solid var(--edge);min-height:96px;box-shadow:0 5px 0 var(--edge)}
.mcard .mn{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;font-family:var(--fd);font-size:1.4rem;background:var(--c);color:#fff}
.mcard b{font-family:var(--fd);font-size:1.08rem;display:block}
.mcard small{display:block;color:var(--ink2);font-weight:700}
.mcard.next{border-color:var(--c);box-shadow:0 5px 0 var(--c),0 0 24px color-mix(in srgb,var(--c) 60%,transparent)}
.mcard.done .mn{background:var(--ok)}
.mcard.boss{grid-column:1/-1;background:linear-gradient(135deg,#2a1660,#4a1f6e);color:#fff;border-color:#ff7cbb}
.mcard.boss small{color:#ffd3ea}
.mcard.boss .mn{background:transparent;width:70px;height:70px}
.mcard.side .mn{background:var(--gold);color:#4a2c00}
.mcard:disabled{opacity:.55;box-shadow:none}

/* Decision */
.dec{max-width:820px;margin:0 auto}
.dopts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
@media (max-width:700px){.dopts{grid-template-columns:1fr}}
.dopt{text-align:left;padding:16px;border-radius:20px;background:var(--panel2);border:3px solid var(--edge);font-weight:800;font-size:1.05rem;min-height:90px;box-shadow:0 5px 0 var(--edge)}
.dopt:active{transform:translateY(3px)}
.dopt span{display:block;font-family:var(--fd);color:var(--pink);font-size:.9rem;margin-bottom:4px}

/* Play */
.play{display:grid;grid-template-columns:250px 1fr;gap:14px;align-items:start}
.turn{border-radius:24px;padding:12px;text-align:center;background:linear-gradient(170deg,color-mix(in srgb,var(--c) 85%,#fff),color-mix(in srgb,var(--c2) 80%,#fff));color:#2b1a55;border:3px solid #fff;box-shadow:0 0 26px var(--c)}
.turn .fig{height:270px;display:flex;justify-content:center;align-items:flex-end}
.turn .fig svg{height:100%;width:auto}
.turn.new .fig{animation:pop .5s cubic-bezier(.2,1.5,.4,1)}
.turn .tl{margin:0;font-weight:900;font-size:.9rem}
.turn .tn{margin:0;font-size:1.9rem;line-height:1.05;color:#fff;font-family:var(--fd);-webkit-text-stroke:6px #2b1a55;paint-order:stroke fill}
.turn .tt{margin:0 0 6px;font-weight:900}
.turn .eb{background:rgba(255,255,255,.85);border-radius:14px;padding:6px 10px;text-align:left;font-weight:800;font-size:.84rem}
.turn .nx{margin:6px 0 0;font-size:.84rem;font-weight:800}
@media (max-width:820px){
 .play{grid-template-columns:1fr}
 .turn{display:grid;grid-template-columns:88px 1fr;gap:10px;text-align:left;align-items:center;padding:8px 12px}
 .turn .fig{height:130px}
 .turn .tn{font-size:1.5rem}
}
.mhead{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px}
.pdots{display:flex;gap:7px}
.pdots span{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.25);border:2px solid rgba(255,255,255,.5)}
.pdots span.past{background:var(--gold);border-color:#fff}
.pdots span.cur{background:var(--pink);border-color:#fff;transform:scale(1.25)}
.mname{color:#fff;font-family:var(--fd);font-size:1.1rem;text-shadow:0 2px 6px rgba(0,0,0,.5)}
.ctype{display:inline-flex;align-items:center;gap:6px;background:var(--c);color:#fff;border-radius:999px;padding:4px 12px;font-weight:900;font-size:.85rem}
.q{font-size:clamp(1.2rem,2.6vw,1.6rem);font-weight:900;line-height:1.35;margin:10px 0 14px}
.q.rid{font-style:italic}
.hintb{border:3px dashed var(--cc,var(--pink));border-radius:16px;padding:10px 14px;margin:0 0 12px;font-weight:700;background:color-mix(in srgb,var(--cc,var(--pink)) 12%,var(--panel))}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opts.three{grid-template-columns:1fr 1fr 1fr}
@media (max-width:640px){.opts,.opts.three{grid-template-columns:1fr}}
.opt{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;min-height:74px;border-radius:20px;background:var(--panel2);border:3px solid var(--edge);font-size:1.06rem;font-weight:800;box-shadow:0 5px 0 var(--edge)}
.opt:not(:disabled):active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.opt .lt{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--c);color:#fff;font-family:var(--fd);flex:none}
.opt.ok{border-color:var(--ok);background:var(--okbg);box-shadow:0 5px 0 var(--ok)}
.opt.ok .lt{background:var(--ok)}
.opt.bad{border-color:var(--oops);background:var(--oopsbg);opacity:.7}
.opt.bad .lt{background:var(--oops)}
.opt.el{opacity:.3;text-decoration:line-through}
.tfb{justify-content:center;font-family:var(--fd);font-size:1.4rem;min-height:96px}
.slots{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.slot{display:flex;align-items:center;gap:10px;min-height:58px;border-radius:16px;border:3px dashed var(--edge);padding:6px 12px;font-weight:800;text-align:left;background:transparent}
.slot .n{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--c);color:#fff;font-family:var(--fd);flex:none}
.slot.fill{border-style:solid;background:var(--panel2)}
.slot.lock{border-color:var(--ok);background:var(--okbg)}
.slot.badp{border-color:var(--oops)}
.pool{display:flex;flex-wrap:wrap;gap:10px}
.pitem{min-height:56px;padding:10px 16px;border-radius:16px;background:var(--panel2);border:3px solid var(--c);font-weight:800;box-shadow:0 4px 0 var(--edge)}
.pitem:disabled{opacity:.25;box-shadow:none}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;align-items:start}
.mcol{display:flex;flex-direction:column;gap:8px}
.mcol h4{margin:0;color:var(--ink2);font-size:.85rem}
.ml{text-align:left;min-height:60px;padding:8px 12px;border-radius:16px;border:3px solid var(--edge);background:var(--panel2);font-weight:800}
.ml .as{display:block;font-size:.85rem;color:var(--c);font-weight:900}
.ml.sel{border-color:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 30%,transparent)}
.ml.lock{border-color:var(--ok);background:var(--okbg)}
.ml.badp{border-color:var(--oops)}
.mr{min-height:60px;padding:8px 12px;border-radius:16px;border:3px solid var(--c);background:var(--panel);font-weight:800;text-align:left}
.mr:disabled{opacity:.35}
.seqtxt{font-size:1.2rem;font-weight:800;line-height:2.4;margin:0 0 12px}
.blank{display:inline-flex;align-items:center;justify-content:center;min-width:120px;min-height:46px;padding:2px 12px;margin:0 4px;border-radius:12px;border:3px dashed var(--c);vertical-align:middle;font-weight:900;background:var(--panel2)}
.blank.lock{border:3px solid var(--ok);background:var(--okbg)}
.blank.badp{border-color:var(--oops)}
.fb{margin-top:14px;padding:14px 16px;border-radius:20px;border:3px solid var(--cc,var(--edge));background:var(--panel2);animation:pop .3s}
.fb .ft{font-family:var(--fd);font-size:1.25rem}
.fb.ok{border-color:var(--ok);background:var(--okbg)}.fb.ok .ft{color:var(--ok)}
.fb.bad{border-color:var(--oops);background:var(--oopsbg)}.fb.bad .ft{color:var(--oops)}
.fb p{font-weight:700}
.fb .rec{border-top:2px dashed var(--edge);margin-top:8px;padding-top:8px}
.powers{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
@media (max-width:900px){.powers{grid-template-columns:1fr 1fr}}
.pw{display:grid;grid-template-columns:48px 1fr;gap:8px;align-items:center;text-align:left;padding:8px 10px;border-radius:18px;background:var(--panel);border:3px solid var(--c);min-height:72px}
.pw:disabled{border-color:var(--edge);filter:saturate(.3);color:var(--ink2)}
.pw:not(:disabled):active{transform:translateY(2px)}
.pw b{display:block;font-size:.92rem;line-height:1.2}
.pw small{display:block;font-size:.76rem;color:var(--ink2);font-weight:700;line-height:1.2}
.dots{display:flex;gap:4px;margin-top:3px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--c);display:block}
.dots i.off{background:var(--edge)}

/* Boss */
.arena{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;margin-bottom:12px;padding:12px 16px;border-radius:24px;background:rgba(18,11,51,.72);border:2px solid rgba(255,124,187,.7);color:#fff;box-shadow:0 0 30px rgba(255,95,168,.35)}
.bossart{width:150px}
.bossart.hit{animation:hit .6s}

.hp{height:20px;border-radius:999px;background:rgba(255,255,255,.18);overflow:hidden;margin:6px 0;border:1px solid rgba(255,255,255,.4)}
.hp i{display:block;height:100%;background:linear-gradient(90deg,#ff7cbb,#a07cf0,#2fd0ea);transition:width .8s}
.lineup{display:flex;gap:6px;margin-top:6px}
.lu{width:58px;border-radius:14px;background:rgba(255,255,255,.12);border:2px solid transparent;padding:2px}
.lu.on{border-color:var(--c);box-shadow:0 0 14px var(--c);background:rgba(255,255,255,.25)}
@media (max-width:600px){.bossart{width:100px}.lu{width:44px}}
.shake{animation:shk .5s}

.beam{position:fixed;height:16px;border-radius:999px;transform-origin:0 50%;background:linear-gradient(90deg,#fff,var(--c),#fff);box-shadow:0 0 20px var(--c),0 0 40px var(--c);animation:beam .7s ease-out forwards;pointer-events:none;z-index:70}

@keyframes wave{from{opacity:1}to{opacity:0}}
.dmg{position:fixed;font-family:var(--fd);font-size:2.4rem;color:#fff;-webkit-text-stroke:6px var(--pink);paint-order:stroke fill;animation:up 1.1s ease-out forwards;z-index:71;transform:translate(-50%,-50%);pointer-events:none}
@keyframes up{to{transform:translate(-50%,-180%);opacity:0}}

/* Results */
.res{max-width:880px;margin:0 auto;text-align:center}
.res h1{margin:0;font-size:clamp(1.6rem,4.4vw,2.4rem);color:var(--pink)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}

.stat{border-radius:18px;background:var(--panel2);border:2px solid var(--edge);padding:10px}
.stat b{display:block;font-family:var(--fd);font-size:1.8rem;color:var(--pink)}
.stat span{font-weight:800;font-size:.86rem;color:var(--ink2)}
.gains{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
@media (max-width:700px){.gains{grid-template-columns:1fr 1fr}}
.gain{border:3px solid var(--c);border-radius:18px;padding:8px;display:flex;flex-direction:column;align-items:center;font-weight:800}
.gain .pf{width:76px}
.gain .up{font-size:.78rem;background:color-mix(in srgb,var(--c) 22%,var(--panel));border-radius:10px;padding:3px 8px;margin-top:4px}
.meter{display:flex;align-items:center;gap:10px;justify-content:center;margin:8px 0}
.meter .bar{width:min(320px,60vw);height:18px}
.reward{width:180px;margin:6px auto;filter:drop-shadow(0 0 26px var(--c));animation:float3 3s ease-in-out infinite}
@keyframes float3{50%{transform:translateY(-10px) rotate(5deg)}}
.big-emoji{font-size:4rem;line-height:1}

/* Crew / inventory / shop / report */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tab{padding:8px 16px;min-height:48px;border-radius:14px;border:3px solid var(--c);font-weight:900;background:var(--panel)}
.tab.on{background:var(--c);color:#fff}
.crew{display:grid;grid-template-columns:240px 1fr;gap:16px;align-items:start}
@media (max-width:700px){.crew{grid-template-columns:1fr}.crew .fig{max-width:200px;margin:0 auto}}
.crew .fig{border-radius:22px;background:linear-gradient(170deg,var(--c),var(--c2));padding:10px;border:3px solid #fff}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:8px 0}
.kv dt{font-weight:900;color:var(--ink2)}.kv dd{margin:0;font-weight:700}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:700px){.grid3{grid-template-columns:1fr 1fr}}
.item{border-radius:18px;background:var(--panel2);border:2px solid var(--edge);padding:12px;text-align:center}
.item .ie{font-size:2.2rem}
.item b{display:block}
.item small{display:block;color:var(--ink2);font-weight:700}
.item.off{opacity:.45}
.toggle{min-height:48px;padding:8px 14px;border-radius:14px;border:3px solid var(--edge);font-weight:900;background:var(--panel)}
.toggle.on{border-color:var(--ok);background:var(--okbg)}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:760px){.rgrid{grid-template-columns:1fr}}
.rcard{border:3px solid var(--c);border-radius:20px;padding:12px;background:var(--panel)}
.rcard h3{margin:0;color:var(--c)}
.rhead{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:center}
.lvlbadge{display:inline-block;border-radius:999px;padding:2px 10px;font-weight:900;font-size:.85rem;background:var(--c);color:#fff}

/* Modal & fx */
.modal{position:fixed;inset:0;z-index:40;background:rgba(10,5,35,.6);display:grid;place-items:center;padding:16px}
.modal .panel{max-width:560px;width:100%}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:50;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(94vw,560px)}
.toast{background:var(--panel);color:var(--ink);border:3px solid var(--c,var(--pink));border-radius:18px;padding:10px 16px;font-weight:900;box-shadow:0 8px 22px rgba(0,0,0,.35);animation:toast 3.4s forwards;text-align:center}
@keyframes toast{0%{opacity:0;transform:translateY(20px)}8%,85%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-10px)}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.pt{position:absolute;margin:-7px 0 0 -7px;background:var(--pc);clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);animation:ptk .95s ease-out forwards}
@keyframes ptk{to{transform:translate(var(--dx),var(--dy)) rotate(200deg) scale(.2);opacity:0}}
.plus{position:absolute;transform:translate(-50%,-50%);font-family:var(--fd);font-size:2rem;color:#fff;-webkit-text-stroke:6px var(--ok);paint-order:stroke fill;animation:up 1.2s ease-out forwards}
.cf{position:absolute;top:-20px;width:12px;height:16px;background:var(--pc);border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--rx),110vh) rotate(720deg)}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
</style>
</head>

let AC=null,musT=null,ms=0;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}}if(AC.state==='suspended')AC.resume();return AC;}
function tone(f,t0,d,type,v){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type||'triangle';o.frequency.value=f;const t=a.currentTime+t0;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v||.1,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.05);}

function center(el){const r=el.getBoundingClientRect();return[r.left+r.width/2,r.top+r.height/2];}
function burst(el,colors,label){if(RM||!el)return;const[x,y]=center(el),fx=$('#fx');for(let i=0;i<22;i++){const s=document.createElement('span');s.className='pt';const a=Math.random()*Math.PI*2,d=60+Math.random()*120,z=8+Math.random()*14;s.style.cssText=`left:${x}px;top:${y}px;width:${z}px;height:${z}px;--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d}px;--pc:${colors[i%colors.length]}`;fx.appendChild(s);setTimeout(()=>s.remove(),1000);}if(label){const t=document.createElement('span');t.className='plus';t.textContent=label;t.style.left=x+'px';t.style.top=y+'px';fx.appendChild(t);setTimeout(()=>t.remove(),1250);}}
function confetti(){if(RM)return;const fx=$('#fx'),cols=['#ff5fa8','#9b6cf0','#ffc94a','#2fd0ea','#fff','#ff9a3c'];for(let i=0;i<110;i++){const s=document.createElement('span');s.className='cf';s.style.cssText=`left:${Math.random()*100}vw;--pc:${cols[i%cols.length]};animation-delay:${Math.random()*1.6}s;animation-duration:${2.6+Math.random()*2}s;--rx:${(Math.random()-.5)*220}px`;fx.appendChild(s);setTimeout(()=>s.remove(),5200);}}
function beam(fromEl,toEl,color){if(!fromEl||!toEl)return;sfx('beam');if(RM){hitBoss();return;}const[a,b]=center(fromEl),[c,d]=center(toEl);const len=Math.hypot(c-a,d-b),ang=Math.atan2(d-b,c-a)*180/Math.PI;const el=document.createElement('div');el.className='beam';el.style.cssText=`left:${a}px;top:${b-8}px;width:${len}px;--a:${ang}deg;--c:${color}`;$('#fx').appendChild(el);setTimeout(()=>{el.remove();},750);setTimeout(hitBoss,380);}
function hitBoss(){const b=app.querySelector('.bossart');if(!b)return;sfx('hit');b.classList.remove('hit');void b.offsetWidth;b.classList.add('hit');const[x,y]=center(b);const t=document.createElement('span');t.className='dmg';t.textContent='¡-1!';t.style.left=x+'px';t.style.top=y+'px';$('#fx').appendChild(t);setTimeout(()=>t.remove(),1150);}
function bossAttack(){const w=document.createElement('div');w.className='wave';$('#fx').appendChild(w);setTimeout(()=>w.remove(),650);app.classList.remove('shake');void app.offsetWidth;app.classList.add('shake');}
(function sky(){const sk=$('#sky');for(let i=0;i<70;i++){const s=document.createElement('span');const big=i%9===0;s.className='st'+(big?' sp':'');const z=big?10+Math.random()*8:1+Math.random()*2.5;s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;width:${z}px;height:${z}px;animation-delay:${Math.random()*3}s;animation-duration:${2+Math.random()*3}s`;sk.appendChild(s);}})();
let sceneKey=null;
function updateScene(){const show=['play','decision','failed'].includes(S.screen)||(S.screen==='dialog'&&S.sceneW!=null);const want=show&&S.sceneW!=null?S.sceneW:null;if(want===sceneKey)return;sceneKey=want;const el=$('#scene');el.innerHTML=want==null?'':sceneSVG(want);el.classList.toggle('on',want!=null);}

/* ===== Progresión ===== */
function medal(pi,name){const p=S.players[pi];if(p.medals.includes(name))return;p.medals.push(name);toast(`${HEROES[pi].name} ganó la medalla “${name}”`,HEROES[pi].c1);}
function teamMedal(name){if(S.medals.includes(name))return;S.medals.push(name);toast(`Medalla del equipo: ${name}`,'#ffc94a');}
function addItem(it){if(!S.items.some(x=>x[1]===it[1])){S.items.push(it);toast(`Nuevo objeto: ${it[0]} ${it[1]}`,'#2fd0ea');}}
function gainXP(pi,n){const p=S.players[pi],b=lvlOf(p.xp);p.xp+=n;const a=lvlOf(p.xp);for(let L=b+1;L<=a;L++){if(L===3)p.charges+=1;toast(`¡${HEROES[pi].name} subió a nivel ${L}! ${UNLOCKS[L]}`,HEROES[pi].c1);setTimeout(()=>sfx('lvl'),400);}}
function rec(pi,ch,w,first,solved){const p=S.players[pi],ws=S.wstats[w];tags(ch).forEach(t=>{const a=p.cons[t]||(p.cons[t]={n:0,first:0,fixed:0}),b=ws.cons[t]||(ws.cons[t]={n:0,first:0,fixed:0});a.n++;b.n++;if(solved){if(first){a.first++;b.first++;}else{a.fixed++;b.fixed++;}}});ws.ans++;if(solved){if(first)ws.first++;else ws.fixed++;}}
function mastery(pct){return pct>=85?'Experta':pct>=65?'Logrado':pct>=40?'En camino':'Para repasar';}

/* ===== Flujo general ===== */
function dialog(lines,then,sceneW){S.dlg={lines,i:0};S.dlgThen=then;S.sceneW=sceneW==null?null:sceneW;S.screen='dialog';render();window.scrollTo(0,0);}
function go(screen){S.screen=screen;S.modal=null;render();window.scrollTo(0,0);}
function startNew(){S=fresh();S.started=true;try{localStorage.removeItem(KEY);}catch(e){}dialog(INTRO,()=>go('select'));}
function openWorld(w){S.wsel=w;const pr=S.prog[w],W=WORLDS[w];if(!pr.arrived){pr.arrived=true;save();dialog(W.arrive,()=>{if(w<4){S.sceneW=w;go('decision');}else go('world');},w);}else go('world');}
function choose(opt){const w=S.wsel,W=WORLDS[w],d=W.decision;S.prog[w].choice=opt;if(opt==='a'){S.coins+=40;addItem(d.a[2]);sfx('coin');}else{S.coins+=10;}save();
 dialog([['aria',opt==='a'?d.a[1]:d.b[1]],['aria',opt==='a'?'Ganaron 40 monedas espaciales.':'Ganaron 10 monedas espaciales. ¡Siempre se aprende algo!']],()=>{if(w===4)startRun(4,'boss',0,true);else go('world');},w);}
function startRun(w,kind,mi,skipIntro){
 if(kind==='boss'&&w===4&&!S.prog[4].choice){S.wsel=4;S.sceneW=4;go('decision');return;}
 const W=WORLDS[w];let pool,n;
 if(kind==='m'){pool=W.missions[mi].pool;n=4;}else if(kind==='side'){pool=W.side.pool;n=4;}else{pool=W.bossPool;n=BOSS_HP[w];}
 const queue=shuffle(pool).slice(0,n),lives=3+(S.shieldNext?1:0);
 if(S.shieldNext)toast('Escudo de nave activado: 4 vidas','#2fd0ea');S.shieldNext=false;
 S.run={w,kind,mi,queue,idx:0,lives,maxLives:lives,hp:queue.length,hpMax:queue.length,xp:[0,0,0,0],coins:0,first:0,fixed:0,lost:0,startLvls:S.players.map(p=>lvlOf(p.xp)),missed:{}};
 S.sceneW=w;newCh();
 if(kind==='boss'&&!skipIntro)dialog(W.boss.intro,()=>go('play'),w);else if(kind==='boss'&&skipIntro)dialog(W.boss.intro,()=>go('play'),w);else go('play');
}
function newCh(){
 const ch=S.run.queue[S.run.idx];const c={ch,tries:0,helped:false,hint:false,shield:false,state:'ask',fresh:true,bad:[],elim:[],lastBad:[]};
 if(['mc','rid','sit'].includes(ch.t))c.order=shuffle(ch.o.map((_,i)=>i));
 if(ch.t==='ord'){let p;do{p=shuffle(ch.items.map((_,i)=>i));}while(p.every((v,i)=>v===i));c.pool=p;c.slots=ch.items.map(()=>null);c.locked=[];}
 if(ch.t==='match'){c.lefts=shuffle(ch.pairs.map((_,i)=>i));c.rights=shuffle([...new Set(ch.pairs.map(p=>p[1]))]);c.assign={};c.locked=[];c.selL=null;}
 if(ch.t==='seq'){c.chips=shuffle(ch.ans.concat(ch.extra));c.fill=ch.ans.map(()=>null);c.locked=[];}
 S.cur=c;
}
const open=()=>S.cur&&S.cur.state==='ask';
function pick(k){const c=S.cur;if(!open()||c.bad.includes(k)||c.elim.includes(k))return;sfx('click');if(k===0)right();else{c.bad.push(k);wrong();}}
function pickTF(v){const c=S.cur;if(!open()||c.bad.includes(v))return;sfx('click');if(v===c.ch.a)right();else{c.bad.push(v);wrong();}}
function ordTap(item){const c=S.cur;if(!open())return;const e=c.slots.findIndex((v,k)=>v===null&&!c.locked.includes(k));if(e<0||c.slots.includes(item))return;c.slots[e]=item;c.lastBad=[];sfx('click');render();}
function ordSlot(k){const c=S.cur;if(!open()||c.locked.includes(k)||c.slots[k]===null)return;c.slots[k]=null;c.lastBad=[];sfx('click');render();}
function matchL(p){const c=S.cur;if(!open()||c.locked.includes(p))return;if(c.assign[p]!=null)delete c.assign[p];c.selL=p;c.lastBad=[];sfx('click');render();}
function matchR(r){const c=S.cur;if(!open()||c.selL==null)return;c.assign[c.selL]=c.rights[r];const next=c.lefts.find(p=>c.assign[p]==null&&!c.locked.includes(p));c.selL=next==null?null:next;sfx('click');render();}
function seqChip(k){const c=S.cur;if(!open()||c.fill.includes(k))return;const e=c.fill.findIndex((v,i)=>v===null&&!c.locked.includes(i));if(e<0)return;c.fill[e]=k;c.lastBad=[];sfx('click');render();}
function seqBlank(i){const c=S.cur;if(!open()||c.locked.includes(i)||c.fill[i]===null)return;c.fill[i]=null;sfx('click');render();}
function check(){const c=S.cur,ch=c.ch;if(!open())return;
 if(ch.t==='ord'){if(c.slots.includes(null))return;const bad=[];c.slots.forEach((v,k)=>{if(v===k){if(!c.locked.includes(k))c.locked.push(k);}else bad.push(k);});if(!bad.length)return right();c.lastBad=bad;bad.forEach(k=>c.slots[k]=null);return wrong();}
 if(ch.t==='match'){if(ch.pairs.some((_,p)=>c.assign[p]==null))return;const bad=[];ch.pairs.forEach((pr,p)=>{if(c.assign[p]===pr[1]){if(!c.locked.includes(p))c.locked.push(p);}else bad.push(p);});if(!bad.length)return right();c.lastBad=bad;bad.forEach(p=>delete c.assign[p]);c.selL=bad[0];return wrong();}
 if(ch.t==='seq'){if(c.fill.includes(null))return;const bad=[];c.fill.forEach((v,i)=>{if(c.chips[v]===ch.ans[i]){if(!c.locked.includes(i))c.locked.push(i);}else bad.push(i);});if(!bad.length)return right();c.lastBad=bad;bad.forEach(i=>c.fill[i]=null);return wrong();}
}
function right(){
 const c=S.cur,r=S.run,pi=S.turn%4,p=S.players[pi],h=HEROES[pi],first=c.tries===0&&!c.helped;
 const xp=first?100:50,coins=first?10:5;c.state='right';c.gain=xp;c.coins=coins;c.cheer=rnd(CHEERS);
 gainXP(pi,xp);S.coins+=coins;r.xp[pi]+=xp;r.coins+=coins;p.streak++;if(p.streak>p.best)p.best=p.streak;
 if(c.tries===0){p.first++;r.first++;}else{p.fixed++;r.fixed++;}
 rec(pi,c.ch,r.w,c.tries===0,true);
 if(p.first===1)medal(pi,'Primer acierto');if(p.streak===3)medal(pi,'Racha de 3');if(p.fixed===1&&c.tries>0)medal(pi,'Corrige y aprende');if(p.first===12)medal(pi,'Mente brillante');
 if(r.kind==='boss')r.hp--;
 sfx('ok');render();
 if(r.kind==='boss')beam(app.querySelector('.lu.on'),app.querySelector('.bossart'),h.c1);
 else burst(app.querySelector('.fb.ok .ft'),[h.c1,h.c2,'#fff','#ffd86b'],'+'+xp);
}
function wrong(){
 const c=S.cur,r=S.run,pi=S.turn%4,p=S.players[pi];c.tries++;p.wrong++;p.streak=0;c.cheer=rnd(ENCOURAGE);
 tags(c.ch).forEach(t=>r.missed[t]=(r.missed[t]||0)+1);
 if(c.shield){c.shield=false;c.saved=true;toast('¡El Escudo de cristal protegió una vida!',HEROES[1].c1);}
 else{r.lives--;r.lost++;c.saved=false;}
 c.state=r.lives<=0?'out':'wrong';sfx('bad');if(r.kind==='boss')bossAttack();render();
}
function retry(){const c=S.cur;c.state='ask';c.fresh=false;render();}
function next(){
 const r=S.run;S.turn++;r.idx++;
 if(r.idx>=r.queue.length){finishRun();return;}
 newCh();save();render();window.scrollTo({top:0,behavior:RM?'auto':'smooth'});
}
function failRun(){const r=S.run,c=S.cur;rec(S.turn%4,c.ch,r.w,false,false);S.turn++;save();go('failed');}
function canUse(i){const c=S.cur;if(!c||c.state!=='ask')return false;const p=S.players[i],ch=c.ch;if(p.charges<=0)return false;
 if(i===0)return!c.hint;
 if(i===1)return!c.shield;
 if(i===3)return S.run.lives<S.run.maxLives;
 if(ch.t==='tf')return false;
 if(['mc','rid','sit'].includes(ch.t))return ch.o.length-1-c.elim.length-c.bad.filter(k=>!c.elim.includes(k)).length>=2;
 if(ch.t==='ord')return ch.items.length-c.locked.length>=2;
 if(ch.t==='match')return ch.pairs.length-c.locked.length>=2;
 if(ch.t==='seq')return ch.ans.length-c.locked.length>=2;
 return false;}
function usePower(i){if(!canUse(i))return;const c=S.cur,ch=c.ch,p=S.players[i],h=HEROES[i];p.charges--;p.powers++;
 if(i===0){c.hint=true;c.helped=true;}
 if(i===1){c.shield=true;}
 if(i===3){S.run.lives=Math.min(S.run.maxLives,S.run.lives+1);}
 if(i===2){c.helped=true;
  if(['mc','rid','sit'].includes(ch.t)){const w=ch.o.map((_,k)=>k).filter(k=>k!==0&&!c.elim.includes(k)&&!c.bad.includes(k));c.elim.push(rnd(w));}
  if(ch.t==='ord'){const k=ch.items.map((_,k)=>k).find(k=>!c.locked.includes(k));const at=c.slots.indexOf(k);if(at>=0)c.slots[at]=null;c.slots[k]=k;c.locked.push(k);}
  if(ch.t==='match'){const pp=c.lefts.find(q=>!c.locked.includes(q));c.assign[pp]=ch.pairs[pp][1];c.locked.push(pp);if(c.selL===pp)c.selL=null;}
  if(ch.t==='seq'){const b=ch.ans.map((_,k)=>k).find(k=>!c.locked.includes(k));const chipIdx=c.chips.findIndex((t,k)=>t===ch.ans[b]&&!c.locked.some(l=>c.fill[l]===k));const at=c.fill.indexOf(chipIdx);if(at>=0)c.fill[at]=null;c.fill[b]=chipIdx;c.locked.push(b);}
 }
 sfx('power');toast(`¡${h.name} usó ${h.power}!`,h.c1);c.fresh=false;render();}
function finishRun(){
 const r=S.run,W=WORLDS[r.w],pr=S.prog[r.w];let bonus={m:20,side:30,boss:50}[r.kind];
 r.perfect=r.lost===0;if(r.perfect){bonus+=20;teamMedal('Misión perfecta');}
 S.coins+=bonus;r.coins+=bonus;r.bonus=bonus;
 if(r.kind==='m'&&!pr.done.includes(r.mi))pr.done.push(r.mi);
 if(r.kind==='side'){if(!pr.side){pr.side=true;addItem(W.side.reward);}if(S.prog.every((p,i)=>!WORLDS[i].side||p.side))teamMedal('Exploradoras');}
 if(r.kind==='boss'){r.firstWin=!pr.boss;pr.boss=true;S.crystals[r.w]=true;addItem(W.item);teamMedal(W.medal);S.players.forEach(p=>{if(p.charges<capOf(p))p.charges=capOf(p);});if(r.w===4)S.won=true;}
 save();go('missionEnd');sfx('win');if(r.kind==='boss')confetti();
}

const POS=[[14,72,28,10],[33,34,72,28],[52,72,28,48],[71,32,72,67],[88,64,48,88]];
function rMap(){

 return hud()+`<section class="panel"><h1 class="d" style="margin-top:0">Taller de la nave</h1><p>Tienen <b>🪙 ${S.coins} monedas espaciales</b>. Se ganan respondiendo, completando misiones y tomando buenas decisiones.</p><div class="grid3">${SHOP.map(s=>{const owned=s.kind==='gear'&&S.owned[s.id],dis=owned||S.coins<s.price||(s.id==='escudo'&&S.shieldNext);return `<div class="item"><div class="ie">${s.e}</div><b>${s.name}</b><small>${s.desc}</small><button class="btn ${owned?'ghost':'gold'}" style="margin-top:8px;width:100%" data-a="buy" data-id="${s.id}" ${dis?'disabled':''}>${owned?'Comprado':s.id==='escudo'&&S.shieldNext?'Ya lo tienen':`Comprar: ${s.price} 🪙`}</button></div>`;}).join('')}</div></section>`;}
function rLog(){
 const fin=S.won;const all=Object.keys(CONCEPTS);
 return hud()+`<section class="panel"><h1 class="d" style="margin-top:0">${fin?'Informe final de las guardianas':'Bitácora de aprendizaje'}</h1><p class="muted">El aprendizaje es más importante que la puntuación. “Domina” significa que respondió bien al primer intento la mayoría de las veces.</p>
 <p><b>Progreso por mundo</b></p>${WORLDS.map((W,w)=>{const ws=S.wstats[w],pct=ws.ans?Math.round(ws.first/ws.ans*100):0;return `<div style="display:grid;grid-template-columns:minmax(120px,220px) 1fr auto;gap:10px;align-items:center;margin:6px 0"><b>${W.short}</b><div class="bar" style="--c:${W.color};--c2:${W.color}"><i style="width:${pct}%"></i></div><span class="muted">${ws.ans?`${mastery(pct)} (${ws.ans} preguntas)`:'Sin jugar'}</span></div>`;}).join('')}
 <div class="rgrid" style="margin-top:14px">${HEROES.map((h,i)=>{const p=S.players[i],ks=Object.keys(p.cons);const dom=ks.filter(t=>p.cons[t].first/p.cons[t].n>=.67),rev=ks.filter(t=>p.cons[t].first/p.cons[t].n<.67);return `<article class="rcard" style="--c:${h.c1}"><div class="rhead"><div>${fig(i,'idle','smile',true)}</div><div><h3 class="d">${h.name}</h3><span class="lvlbadge">Nivel ${lvlOf(p.xp)}</span> <span class="muted">${p.first} aciertos al primer intento, ${p.fixed} errores corregidos</span></div></div>
 <p><b>Domina</b></p><div class="chips">${dom.length?dom.map(t=>`<span class="chip ok">✓ ${CONCEPTS[t][0]}</span>`).join(''):'<span class="muted">Todavía no hay datos suficientes.</span>'}</div>
 <p><b>Para repasar</b></p>${rev.length?rev.map(t=>`<p style="margin:4px 0"><span class="chip rev">${CONCEPTS[t][0]}</span> <span class="muted">${CONCEPTS[t][1]}</span></p>`).join(''):'<p class="muted">¡Nada pendiente por ahora!</p>'}</article>`;}).join('')}</div>
 ${fin?`<p class="muted" style="margin-top:12px">Conceptos sin practicar todavía: ${all.filter(t=>!S.players.some(p=>p.cons[t])).map(t=>CONCEPTS[t][0]).join(', ')||'ninguno'}.</p>`:''}</section>`;}
function rVictory(){const tot=S.wstats.reduce((a,w)=>a+w.ans,0),fst=S.wstats.reduce((a,w)=>a+w.first,0);
 return `<section class="res" style="padding-top:8px"><p class="tag">Los cinco cristales brillan juntos</p><div class="tgirls" style="margin:10px auto">${HEROES.map((h,i)=>`<div style="--d:${i*.3}s">${heroSVG(i,{pose:'cheer',expr:'happy',gear:S.gear,aura:true})}</div>`).join('')}</div>
 <h1 class="logo2 ttl" style="font-size:clamp(2rem,6vw,4rem)">¡El universo está a salvo!</h1>
 <div class="panel" style="margin-top:14px"><p class="say">Catu, Lupe, Rufi y Emma vencieron al Vacío Cósmico. El conocimiento llenó el vacío y los planetas recuperaron su energía.</p>
 <div class="stats"><div class="stat"><b>${tot}</b><span>preguntas respondidas</span></div><div class="stat"><b>${fst}</b><span>aciertos al primer intento</span></div><div class="stat"><b>5</b><span>cristales</span></div><div class="stat"><b>${S.coins}</b><span>monedas</span></div></div>
 <div class="chips" style="justify-content:center">${S.medals.map(m=>`<span class="chip">🏅 ${m}</span>`).join('')}</div>
 <div class="row c"><button class="btn gold" data-a="go" data-s="log" data-focus>Ver informe final</button><button class="btn" data-a="ship">Volver a la nave</button><button class="btn ghost" data-a="reset">Jugar de nuevo</button></div></div></section>`;}
function rModal(){
 if(S.modal==='leave')return `<div class="modal"><div class="panel" role="dialog" aria-modal="true"><h2 class="d" style="margin-top:0">¿Salir de la misión?</h2><p>Se pierde el avance de esta misión, pero la experiencia y las monedas ganadas quedan guardadas.</p><div class="row"><button class="btn" data-a="leave-yes">Salir</button><button class="btn ghost" data-a="close" data-focus>Seguir jugando</button></div></div></div>`;
 if(S.modal==='reset')return `<div class="modal"><div class="panel" role="dialog" aria-modal="true"><h2 class="d" style="margin-top:0">¿Reiniciar el juego?</h2><p>Se borra todo el progreso guardado: niveles, cristales, monedas, objetos e informes.</p><div class="row"><button class="btn" data-a="reset-yes">Sí, empezar de nuevo</button><button class="btn ghost" data-a="close" data-focus>Cancelar</button></div></div></div>`;
 return '';}
function render(){
 updateScene();
 const R={title:rTitle,dialog:rDialog,select:rSelect,ship:rShip,map:rMap,world:rWorld,decision:rDecision,play:rPlay,missionEnd:rMissionEnd,report:rReport,reward:rReward,failed:rFailed,crew:rCrew,inventory:rInventory,shop:rShop,log:rLog,victory:rVictory};
 const html=R[S.screen]();
 app.innerHTML=html+(S.modal?rModal():'');
 if(S.screen==='victory'&&!S.vfx){S.vfx=true;confetti();sfx('win');}
 const f=(S.modal?app.querySelector('.modal [data-focus]'):null)||app.querySelector('[data-focus]');if(f)f.focus({preventScroll:true});
}

/* ===== Acciones ===== */
let audioStarted=false;
app.addEventListener('click',e=>{
 if(!audioStarted){audioStarted=true;if(SND.music)musicOn();}
 const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const a=b.dataset.a,d=b.dataset;
 if(!['pick','tf','oitem','oslot','ml','mr','schip','sblank','check','power','next'].includes(a))sfx('click');
 switch(a){
  case 'new':if(loadData())S.modal='reset',render();else startNew();break;
  case 'reset':S.modal='reset';render();break;
  case 'reset-yes':S.modal=null;S.vfx=false;startNew();break;
  case 'continue':{const dd=loadData();S=Object.assign(fresh(),dd||{});S.screen='ship';if(!S.ready.every(Boolean))S.screen='select';render();break;}
  case 'music':SND.music=!SND.music;saveSnd();SND.music?musicOn():musicOff();render();break;
  case 'sfx':SND.sfx=!SND.sfx;saveSnd();render();break;
  case 'dnext':S.dlg.i++;if(S.dlg.i>=S.dlg.lines.length){const f=S.dlgThen;S.dlgThen=null;f();}else render();break;
  case 'dskip':{const f=S.dlgThen;S.dlgThen=null;f();break;}
  case 'ready':S.ready[+d.i]=!S.ready[+d.i];if(S.ready[+d.i])sfx('ok');save();render();break;
  case 'board':teamMedal('Tripulación lista');save();dialog(BOARD,()=>go('ship'));break;
  case 'ship':S.run=null;S.cur=null;go('ship');break;
  case 'map':S.run=null;S.cur=null;go('map');break;
  case 'go':go(d.s);break;
  case 'world':S.run=null;S.cur=null;openWorld(+d.w);break;
  case 'choose':choose(d.v);break;
  case 'run':startRun(S.wsel,d.k,+d.i);break;
  case 'rerun':{const r=S.run;startRun(r.w,r.kind,r.mi);break;}
  case 'pick':pick(+d.k);break;
  case 'tf':pickTF(d.v==='true');break;
  case 'oitem':ordTap(+d.k);break;
  case 'oslot':ordSlot(+d.k);break;
  case 'ml':matchL(+d.k);break;
  case 'mr':matchR(+d.k);break;
  case 'schip':seqChip(+d.k);break;
  case 'sblank':seqBlank(+d.k);break;
  case 'check':check();break;
  case 'retry':retry();break;
  case 'next':next();break;
  case 'fail':failRun();break;
  case 'power':usePower(+d.i);break;
  case 'leave':S.modal='leave';render();break;
  case 'leave-yes':{const w=S.run.w;S.modal=null;S.run=null;S.cur=null;save();openWorld(w);break;}
  case 'close':S.modal=null;render();break;
  case 'csel':S.csel=+d.i;render();break;
  case 'gear':S.gear[d.g]=!S.gear[d.g];save();render();break;
  case 'buy':{const s=SHOP.find(x=>x.id===d.id);if(!s||S.coins<s.price)break;S.coins-=s.price;if(s.id==='recarga')S.players.forEach(p=>p.charges++);if(s.id==='escudo')S.shieldNext=true;if(s.kind==='gear'){S.owned[s.id]=true;S.gear[s.id]=true;}sfx('coin');toast(`Compraron: ${s.name}`,'#ffc94a');save();render();break;}
 }
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&S.modal){S.modal=null;render();return;}
 if(S.screen!=='play'||!S.cur||S.modal||S.cur.state!=='ask'||e.ctrlKey||e.metaKey||e.altKey)return;
 const n=parseInt(e.key,10);if(!(n>=1&&n<=5))return;const ch=S.cur.ch;
 if(['mc','rid','sit'].includes(ch.t)&&S.cur.order[n-1]!=null)pick(S.cur.order[n-1]);
 if(ch.t==='tf'&&n<=2)pickTF(n===1);
});
render();

</script>
</body>
</html>
